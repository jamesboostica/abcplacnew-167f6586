name: Deploy Build to Production Branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Compile
        run: |
          npm ci
          npm run build

      - name: Push Compiled Code to Build Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: production-deploy
          folder: dist
